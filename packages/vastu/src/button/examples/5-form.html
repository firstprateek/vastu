<!-- title: In a form
     description: type="submit" submits the form with name=value; the default type="button" never submits. -->
<form>
  <va-text-field label="Email" name="email" type="email" value="ada@example.com"></va-text-field>
  <va-button type="submit" name="intent" value="subscribe">Subscribe</va-button>
  <va-button type="reset" variant="secondary">Reset</va-button>
</form>
