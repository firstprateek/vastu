<!-- title: After a vote
     description: Set value to the answer the user chose before, and the poll shows the results with that answer marked. help-text adds a note under the vote count. -->
<va-poll label="Which view library do you use most?" value="lit" help-text="The poll closes on Friday.">
  <button value="lit" data-votes="48">Lit</button>
  <button value="react" data-votes="61">React</button>
  <button value="vue" data-votes="27">Vue</button>
  <button value="none" data-votes="14">None, plain DOM</button>
</va-poll>
