<!doctype html>
<html lang="en" data-va-brand="vastu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sign-in-error</title>
    <link rel="stylesheet" href="/assets/vastu.css">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="/assets/vastu.js"></script>
    
  </head>
  <body>
    <main>
<section class="sign-in" aria-labelledby="sign-in-heading">
  <h1 id="sign-in-heading">Sign in</h1>
  <form class="sign-in__form" method="post">
    <va-text-field
      label="Email address"
      name="email"
      type="email"
      autocomplete="email"
      value="ada@example.com"
      required
    ></va-text-field>
    <va-text-field
      label="Password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
      error="Incorrect password. Try again."
    ></va-text-field>
    <va-button type="submit">Sign in</va-button>
  </form>
</section>

    </main>
  </body>
</html>
