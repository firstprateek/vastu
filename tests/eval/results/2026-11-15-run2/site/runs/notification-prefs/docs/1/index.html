<!doctype html>
<html lang="en" data-va-brand="vastu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>notification-prefs</title>
    <link rel="stylesheet" href="/assets/vastu.css">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="/assets/vastu.js"></script>
    
  </head>
  <body>
    <main>
<section class="prefs" aria-labelledby="prefs-heading">
  <h1 id="prefs-heading">Notification preferences</h1>
  <p class="prefs-intro">Choose how we contact you about activity on your account.</p>

  <form class="prefs-form">
    <fieldset class="prefs-group">
      <legend>Send me notifications by</legend>
      <va-checkbox name="channels" value="email" checked>
        Email
        <span slot="description">Sent to the address on your account.</span>
      </va-checkbox>
      <va-checkbox name="channels" value="sms">
        SMS
        <span slot="description">Text messages to your mobile number. Carrier rates may apply.</span>
      </va-checkbox>
      <va-checkbox name="channels" value="push">
        Push
        <span slot="description">Alerts on devices where you're signed in.</span>
      </va-checkbox>
    </fieldset>

    <div class="prefs-actions">
      <va-button type="submit">Save preferences</va-button>
    </div>
  </form>
</section>

    </main>
  </body>
</html>
