<!doctype html>
<html lang="en" data-va-brand="vastu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>row-actions</title>
    <link rel="stylesheet" href="/assets/vastu.css">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="/assets/vastu.js"></script>
    <script type="module" src="page.js"></script>
  </head>
  <body>
    <main>
<section class="files" aria-labelledby="files-heading">
  <header class="files__header">
    <h1 id="files-heading" tabindex="-1">Files</h1>
    <p class="files__count" id="files-count" aria-live="polite">3 files</p>
  </header>

  <ul class="files__list" id="file-list">
    <li class="file" data-file="report.pdf">
      <svg class="file__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      <div class="file__text">
        <span class="file__name">report.pdf</span>
        <span class="file__meta">PDF document · 2.4 MB</span>
      </div>
      <va-menu label="Actions" placement="bottom-end">
        <button value="rename">Rename</button>
        <button value="download">Download</button>
        <button value="delete">Delete</button>
      </va-menu>
    </li>
    <li class="file" data-file="photo.png">
      <svg class="file__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      <div class="file__text">
        <span class="file__name">photo.png</span>
        <span class="file__meta">PNG image · 1.1 MB</span>
      </div>
      <va-menu label="Actions" placement="bottom-end">
        <button value="rename">Rename</button>
        <button value="download">Download</button>
        <button value="delete">Delete</button>
      </va-menu>
    </li>
    <li class="file" data-file="notes.txt">
      <svg class="file__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 12h6M9 15h6M9 18h3"/></svg>
      <div class="file__text">
        <span class="file__name">notes.txt</span>
        <span class="file__meta">Text file · 4 KB</span>
      </div>
      <va-menu label="Actions" placement="bottom-end">
        <button value="rename">Rename</button>
        <button value="download">Download</button>
        <button value="delete">Delete</button>
      </va-menu>
    </li>
  </ul>

  <p class="files__empty" id="files-empty" hidden>No files left.</p>
</section>

<form id="rename-form" novalidate>
  <va-dialog id="rename-dialog" heading="Rename file">
    <va-text-field id="rename-field" label="File name" name="filename" required autocomplete="off"></va-text-field>
    <va-button slot="footer" variant="secondary" commandfor="rename-dialog" command="--close">Cancel</va-button>
    <va-button slot="footer" type="submit">Save</va-button>
  </va-dialog>
</form>

<va-dialog id="delete-dialog" heading="Delete this file?">
  <p><strong id="delete-name"></strong> will be deleted. You can't undo this.</p>
  <va-button slot="footer" variant="secondary" commandfor="delete-dialog" command="--close">Cancel</va-button>
  <va-button slot="footer" variant="danger" id="delete-confirm">Delete file</va-button>
</va-dialog>

<va-toast id="toaster"></va-toast>

    </main>
  </body>
</html>
