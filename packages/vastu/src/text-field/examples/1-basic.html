<!-- title: Label, help and placeholder
     description: Every field has a visible label. Help text says what format to use; a placeholder only gives an example. -->
<va-text-field label="Full name" autocomplete="name"></va-text-field>
<va-text-field label="Username" help-text="Letters and numbers only, 3 to 20 characters." placeholder="e.g. ada99" minlength="3" maxlength="20" pattern="[A-Za-z0-9]+"></va-text-field>
