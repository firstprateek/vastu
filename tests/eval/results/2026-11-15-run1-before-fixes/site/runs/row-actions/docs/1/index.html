<!doctype html>
<html lang="en" data-va-brand="vastu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>row-actions</title>
    <link rel="stylesheet" href="/assets/vastu.css">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="/assets/vastu.js"></script>
    <script type="module" src="page.js"></script>
  </head>
  <body>
    <main>
<section class="files" aria-labelledby="files-heading">
  <h1 id="files-heading" tabindex="-1">Files</h1>

  <ul class="file-list" id="file-list">
    <li class="file-row" data-name="report.pdf">
      <svg class="file-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>
      <div class="file-info">
        <span class="file-name">report.pdf</span>
        <span class="file-meta">PDF document · 2.4 MB</span>
      </div>
      <va-menu label="Actions" placement="bottom-end">
        <button value="rename">Rename</button>
        <button value="download">Download</button>
        <button value="delete">Delete</button>
      </va-menu>
    </li>
    <li class="file-row" data-name="photo.png">
      <svg class="file-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      <div class="file-info">
        <span class="file-name">photo.png</span>
        <span class="file-meta">PNG image · 3.1 MB</span>
      </div>
      <va-menu label="Actions" placement="bottom-end">
        <button value="rename">Rename</button>
        <button value="download">Download</button>
        <button value="delete">Delete</button>
      </va-menu>
    </li>
    <li class="file-row" data-name="notes.txt">
      <svg class="file-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h8"/></svg>
      <div class="file-info">
        <span class="file-name">notes.txt</span>
        <span class="file-meta">Text file · 4 KB</span>
      </div>
      <va-menu label="Actions" placement="bottom-end">
        <button value="rename">Rename</button>
        <button value="download">Download</button>
        <button value="delete">Delete</button>
      </va-menu>
    </li>
  </ul>

  <p class="empty" id="empty-message" hidden>No files left.</p>
</section>

<va-dialog id="rename-dialog" heading="Rename file">
  <va-text-field id="rename-field" label="File name" required></va-text-field>
  <va-button slot="footer" variant="secondary" commandfor="rename-dialog" command="--close">Cancel</va-button>
  <va-button slot="footer" id="rename-save">Save</va-button>
</va-dialog>

<va-dialog id="delete-dialog" heading="Delete this file?">
  <p id="delete-message">This file will be deleted. You can't undo this.</p>
  <va-button slot="footer" variant="secondary" commandfor="delete-dialog" command="--close">Cancel</va-button>
  <va-button slot="footer" variant="danger" id="delete-confirm">Delete file</va-button>
</va-dialog>

<va-toast id="toaster"></va-toast>

    </main>
  </body>
</html>
