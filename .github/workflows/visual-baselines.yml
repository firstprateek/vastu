name: Update visual baselines

# Run by hand after an intended visual change. Regenerates every screenshot baseline in the
# same Linux Playwright image CI compares against, and commits them to the branch it ran on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:visual:update
        env:
          HOME: /root
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name firstprateek
          git config user.email 16018717+firstprateek@users.noreply.github.com
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git commit -m "Update visual baselines" -m "Generated by the Update visual baselines workflow in mcr.microsoft.com/playwright:v1.65.1-noble."
          git push
