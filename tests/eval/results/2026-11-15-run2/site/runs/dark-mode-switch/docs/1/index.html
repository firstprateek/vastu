<!doctype html>
<html lang="en" data-va-brand="vastu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dark-mode-switch</title>
    <link rel="stylesheet" href="/assets/vastu.css">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="/assets/vastu.js"></script>
    <script type="module" src="page.js"></script>
  </head>
  <body>
    <main>
<section class="appearance" aria-labelledby="appearance-heading">
  <h1 id="appearance-heading">Appearance</h1>
  <p class="intro">Choose how this page looks. The change applies straight away and is remembered on this device.</p>

  <div class="setting">
    <va-switch id="dark-theme-switch">
      Dark theme
      <span slot="description">Uses darker colours for the whole page.</span>
    </va-switch>
  </div>

  <p class="status" id="theme-status" role="status" aria-live="polite"></p>
</section>

    </main>
  </body>
</html>
