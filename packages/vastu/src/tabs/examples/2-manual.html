<!-- title: Manual activation
     description: With activation="manual", arrow keys only move focus; Enter or Space selects. Use it when showing a panel is slow. -->
<va-tabs label="Reports" activation="manual" selected="1">
  <button slot="tab">Daily</button>
  <button slot="tab">Weekly</button>
  <button slot="tab">Monthly</button>
  <div slot="panel"><p>Today's numbers.</p></div>
  <div slot="panel"><p>This week's numbers.</p></div>
  <div slot="panel"><p>This month's numbers.</p></div>
</va-tabs>
