<!doctype html>
<html lang="en" data-va-brand="vastu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>notification-prefs</title>
    <link rel="stylesheet" href="/assets/vastu.css">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="/assets/vastu.js"></script>
    <script type="module" src="page.js"></script>
  </head>
  <body>
    <main>
<h1>Notification preferences</h1>

<form id="notification-prefs" class="prefs-form">
  <fieldset class="prefs-group">
    <legend>Notify me by</legend>
    <va-checkbox name="channels" value="email" checked>
      Email
      <span slot="description">Sent to the address on your account.</span>
    </va-checkbox>
    <va-checkbox name="channels" value="sms">
      SMS
      <span slot="description">Text messages to your mobile number.</span>
    </va-checkbox>
    <va-checkbox name="channels" value="push">
      Push
      <span slot="description">Alerts on devices where you're signed in.</span>
    </va-checkbox>
  </fieldset>

  <div class="prefs-actions">
    <va-button type="submit">Save preferences</va-button>
  </div>

  <p id="prefs-status" class="prefs-status" role="status"></p>
</form>

    </main>
  </body>
</html>
