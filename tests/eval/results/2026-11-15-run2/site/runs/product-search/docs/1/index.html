<!doctype html>
<html lang="en" data-va-brand="vastu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>product-search</title>
    <link rel="stylesheet" href="/assets/vastu.css">
    <link rel="stylesheet" href="/assets/base.css">
    <link rel="stylesheet" href="page.css">
    <script type="module" src="/assets/vastu.js"></script>
    
  </head>
  <body>
    <main>
<h1 class="product-search-title">Product search</h1>
<form class="product-search" role="search" action="" method="get">
  <va-text-field
    class="product-search-field"
    label="Search products"
    type="search"
    name="q"
    placeholder="e.g. running shoes"
    autocomplete="off"
    required
  ></va-text-field>
  <va-button type="submit">Search</va-button>
</form>

    </main>
  </body>
</html>
